  <line x1="80" y1="200" x2="432" y2="200" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <!-- Center line subtle -->
  <line x1="256" y1="72" x2="256" y2="440" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Sparkle large -->
  <path d="M400 58 L410 88 L440 98 L410 108 L400 138 L390 108 L360 98 L390 88 Z" fill="#EFCF20"/>
  <!-- Sparkle small -->
  <circle cx="378" cy="64" r="7" fill="#F4E064" opacity="0.7"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#D4BAFF"/>
      <stop offset="100%" stop-color="#6B3FA0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
  </defs>
</svg>
