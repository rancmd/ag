<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#A083D5"/>
  <!-- Gem body -->
  <path d="M256 72 L432 200 L256 440 L80 200 Z" fill="url(#g1)"/>
  <!-- Top facet -->
  <path d="M80 200 L256 72 L432 200 L256 200 Z" fill="url(#g2)"/>
