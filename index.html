<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Art Gem" />
  <meta name="theme-color" content="#0D0D0D" />
  <!-- PWA icons (add your own later) -->
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Art Gem</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0D0D0D;
      /* Prevent any bounce / rubber-band on the shell itself */
      overscroll-behavior: none;
    }

    /* ---- The track: 3 panels side by side ---- */
    #track {
      display: flex;
      width: 300vw;          /* 3 panels × 100vw */
      height: 100dvh;
      /* Start centred on feed (panel index 1) */
      transform: translateX(-100vw);
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    /* ---- Each panel is one full screen ---- */
    .panel {
      width: 100vw;
      height: 100dvh;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    /* ---- Each iframe fills its panel completely ---- */
    .panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      /* Critical for iOS iframe scroll */
      overflow: hidden;
    }

    /* ---- Loading state ---- */
    .panel-loader {
      position: absolute;
      inset: 0;
      background: #0D0D0D;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.4s;
    }
    .panel-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loader-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: loaderPulse 1.2s ease infinite;
    }
    .loader-dot:nth-child(2) { animation-delay: 0.2s; margin: 0 6px; }
    .loader-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes loaderPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.1); }
    }
  </style>
</head>
<body>

<div id="track">

  <!-- Panel 0: Menu (swipe right to reach) -->
  <div class="panel" id="panel-menu">
    <div class="panel-loader" id="loader-menu">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
    <iframe
      id="frame-menu"
      src="menu.html"
      scrolling="no"
      onload="hideLoader('menu')"
    ></iframe>
  </div>

  <!-- Panel 1: Feed (default / centre) -->
  <div class="panel" id="panel-feed">
    <div class="panel-loader" id="loader-feed">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
    <iframe
      id="frame-feed"
      src="feed.html"
      scrolling="no"
      onload="hideLoader('feed')"
    ></iframe>
  </div>

  <!-- Panel 2: Profile (swipe left to reach) -->
  <div class="panel" id="panel-profile">
    <div class="panel-loader" id="loader-profile">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
    <iframe
      id="frame-profile"
      src="profile.html"
      scrolling="no"
      onload="hideLoader('profile')"
    ></iframe>
  </div>

</div><!-- /track -->

<script>
  // ---- Panel state ----
  // 0 = menu, 1 = feed, 2 = profile
  let currentPanel = 1;
  const PANEL_COUNT = 3;
  const track = document.getElementById('track');

  function goToPanel(index, animate = true) {
    if (index < 0 || index >= PANEL_COUNT) return;
    currentPanel = index;
    track.style.transition = animate
      ? 'transform 0.38s cubic-bezier(0.4, 0, 0.2, 1)'
      : 'none';
    track.style.transform = `translateX(${-index * 100}vw)`;
  }

  // Expose to iframes so they can trigger navigation
  window.goToPanel = goToPanel;
  window.getCurrentPanel = () => currentPanel;

  // ---- Hide loader when iframe loads ----
  function hideLoader(name) {
    const el = document.getElementById('loader-' + name);
    if (el) el.classList.add('hidden');
  }

  // ---- Touch / swipe handling on the shell ----
  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartTime = 0;
  let isDragging = false;
  let dragStartPanel = 1;

  document.addEventListener('touchstart', e => {
    touchStartX    = e.touches[0].clientX;
    touchStartY    = e.touches[0].clientY;
    touchStartTime = Date.now();
    isDragging     = false;
    dragStartPanel = currentPanel;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - touchStartX;
    const dy = Math.abs(e.touches[0].clientY - touchStartY);

    // Only hijack clearly horizontal swipes
    if (!isDragging && Math.abs(dx) > 8 && Math.abs(dx) > dy * 1.5) {
      isDragging = true;
    }

    if (isDragging) {
      // Live drag: move track with finger
      const offset = -(dragStartPanel * window.innerWidth) + dx;
      track.style.transition = 'none';
      track.style.transform  = `translateX(${offset}px)`;
    }
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!isDragging) return;

    const dx       = e.changedTouches[0].clientX - touchStartX;
    const duration = Date.now() - touchStartTime;
    const isFlick  = duration < 300 && Math.abs(dx) > 40;
    const isDrag   = Math.abs(dx) > window.innerWidth * 0.3;

    if ((isFlick || isDrag) && dx < 0 && dragStartPanel < PANEL_COUNT - 1) {
      // Swipe left → next panel (profile)
      goToPanel(dragStartPanel + 1);
    } else if ((isFlick || isDrag) && dx > 0 && dragStartPanel > 0) {
      // Swipe right → prev panel (menu)
      goToPanel(dragStartPanel - 1);
    } else {
      // Snap back
      goToPanel(dragStartPanel);
    }

    isDragging = false;
  }, { passive: true });

  // ---- Allow iframes to call navigation ----
  // Usage from inside an iframe: window.parent.goToPanel(0)
  // panel 0 = menu, 1 = feed, 2 = profile
</script>

</body>
</html>
