<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ART GEM" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#A083D5" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.svg" />

  <!-- SEO -->
  <title>ART GEM — Discover Artists & Creative Process</title>
  <meta name="description" content="A free, ad-free creative world where you can discover and watch artists create, learn from their process, and support them." />

  <!-- Preconnect fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- CSS — load order matters -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/following.css" />

  <!-- Inline critical: prevent FOUC on feed dark bg -->
  <style>
    body { background: #fff; }
    #page-feed { background: #0A0A0A; }
  </style>
</head>

<body>
  <div id="app">

    <!-- ── Page Container ── -->
    <div id="page-container">

      <!-- Feed -->
      <div id="page-feed" class="page"></div>

      <!-- Search / Discover -->
      <div id="page-search" class="page"></div>

      <!-- Following -->
      <div id="page-following" class="page"></div>

      <!-- Artist Profile (rendered dynamically) -->
      <div id="page-profile" class="page"></div>

    </div><!-- /page-container -->

    <!-- ── Bottom Navigation ── -->
    <nav id="bottom-nav" role="navigation" aria-label="Main navigation">

      <button class="nav-btn active" data-page="feed" aria-label="Feed">
        <!-- Play/feed icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>Feed</span>
      </button>

      <button class="nav-btn" data-page="search" aria-label="Discover">
        <!-- Search/compass icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span>Discover</span>
      </button>

      <button class="nav-btn" data-page="following" aria-label="Following">
        <!-- Heart icon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>Following</span>
      </button>

    </nav><!-- /bottom-nav -->

  </div><!-- /app -->

  <!-- ── Scripts — order is important ── -->
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/search.js"></script>
  <script src="js/following.js"></script>
  <script src="js/app.js"></script>

  <!-- ── Service Worker registration ── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
