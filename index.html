<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ART GEM" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#A083D5" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-180.svg" />

  <!-- SEO -->
  <title>ART GEM — Discover Artists & Creative Process</title>
  <meta name="description" content="A free, ad-free creative world where you can discover and watch artists create, learn from their process, and support them." />

  <!-- Preconnect fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- CSS — load order matters -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/search.css" />
  <link rel="stylesheet" href="css/following.css" />

  <!-- Inline critical: prevent FOUC on feed dark bg -->
  <style>
    body { background: #fff; }
    #page-feed { background: #0A0A0A; }
  </style>
</head>

<body>
  <div id="app">

    <!-- ── Top Floating Navigation ── -->
    <nav id="top-nav" role="navigation" aria-label="Main navigation">
      <div class="top-nav-tabs">
        <button class="nav-btn active" data-page="feed">Feed</button>
        <button class="nav-btn" data-page="search">Discover</button>
        <button class="nav-btn" data-page="following">Following</button>
      </div>
    </nav>

    <!-- ── Page Container ── -->
    <div id="page-container">

      <!-- Feed -->
      <div id="page-feed" class="page"></div>

      <!-- Search / Discover -->
      <div id="page-search" class="page"></div>

      <!-- Following -->
      <div id="page-following" class="page"></div>

      <!-- Artist Profile (rendered dynamically) -->
      <div id="page-profile" class="page"></div>

    </div><!-- /page-container -->

  </div><!-- /app -->

  <!-- ── Scripts — order is important ── -->
  <script src="js/libs/xlsx.full.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/router.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/search.js"></script>
  <script src="js/following.js"></script>
  <script src="js/app.js"></script>

  <!-- ── Service Worker registration ── -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

</body>
</html>
