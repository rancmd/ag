<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Art Gem — Menu</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--bg); overflow: hidden; }

    #menu-page {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ---- Top ---- */
    .menu-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(env(safe-area-inset-top,16px),16px) 20px 12px;
    }
    .menu-logo {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    /* ---- Scroll ---- */
    .menu-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 90px;
    }
    .menu-scroll::-webkit-scrollbar { display: none; }

    /* ---- User Card ---- */
    .user-card {
      margin: 8px 20px 24px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--text);
      margin-bottom: 2px;
    }
    .user-handle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .user-type {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 50px;
      background: var(--purple-pale);
      color: var(--purple-deep);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .edit-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--purple-pale);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--purple);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .edit-btn:active { background: var(--purple-light); }

    /* ---- Stats Row ---- */
    .stats-row {
      display: flex;
      justify-content: space-around;
      margin: 0 20px 24px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      padding: 16px 0;
      box-shadow: var(--shadow-sm);
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .stat-num {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--text);
    }
    .stat-lbl {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .stat-divider {
      width: 1px;
      background: var(--border);
    }

    /* ---- Sign In Prompt (logged out) ---- */
    .signin-prompt {
      margin: 8px 20px 24px;
      background: linear-gradient(135deg, var(--purple-pale) 0%, #FFF8CC 100%);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      text-align: center;
    }
    .signin-prompt h2 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: var(--text);
    }
    .signin-prompt p {
      font-size: 0.82rem;
      margin-bottom: 16px;
      color: var(--text-muted);
    }
    .signin-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 50px;
      background: #fff;
      border: 1.5px solid var(--border);
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .google-btn:active { transform: scale(0.97); }
    .google-icon {
      width: 20px; height: 20px;
    }

    /* ---- Section ---- */
    .menu-section {
      margin: 0 20px 20px;
    }
    .menu-section-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-light);
      margin-bottom: 8px;
      padding-left: 4px;
    }
    .menu-group {
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-body);
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: var(--purple-pale); }
    .menu-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .menu-item-label {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .menu-item-value {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .menu-chevron {
      color: var(--text-light);
    }

    /* ---- Toggle ---- */
    .menu-toggle {
      width: 44px; height: 24px;
      border-radius: 12px;
      background: var(--border);
      position: relative;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .menu-toggle.on { background: var(--purple); }
    .menu-toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .menu-toggle.on::after { transform: translateX(20px); }

    /* ---- Version ---- */
    .app-version {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-light);
      padding: 8px 0 24px;
    }

    /* ---- Bottom Nav ---- */
    .bottom-nav-light {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom,0px));
      background: rgba(249,248,246,0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      z-index: 50;
    }
    .nav-item-light {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 16px;
    }
    .nav-item-light svg { color: var(--text-light); }
    .nav-item-light.active svg { color: var(--purple); }
    .nav-item-light .nav-label {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-light);
      font-family: var(--font-body);
    }
    .nav-item-light.active .nav-label { color: var(--purple); }

    /* ---- Logged in / out states ---- */
    #loggedInView  { display: none; }
    #loggedOutView { display: block; }
  </style>
</head>

<script>
  // Check persisted login state
  const isLoggedIn = sessionStorage.getItem('ag_loggedIn') === 'true';
  if (isLoggedIn) showLoggedIn();

  function simulateLogin() {
    sessionStorage.setItem('ag_loggedIn', 'true');
    showLoggedIn();
    showToast('Welcome back, Jamie! 👋');
  }

  function simulateLogout() {
    sessionStorage.removeItem('ag_loggedIn');
    document.getElementById('loggedInView').style.display = 'none';
    document.getElementById('loggedOutView').style.display = 'block';
    showToast('Logged out');
  }

  function showLoggedIn() {
    document.getElementById('loggedOutView').style.display = 'none';
    document.getElementById('loggedInView').style.display = 'block';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // Swipe right → back to feed
  let sx = 0, sy = 0;
  document.getElementById('menu-page').addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  document.getElementById('menu-page').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = Math.abs(e.changedTouches[0].clientY - sy);
    if (dx > 60 && dy < 50) window.location.href = 'feed.html';
  }, { passive: true });
</script>

</body>
</html>
